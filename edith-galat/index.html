<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edith Galat Camerini — Maisons Naturéa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand-100:#e7e0cd;
    --sand-50:#f2eee1;
    --ink:#20281f;
    --ink-muted:#5c6459;
    --surface:#fbf9f3;
    --panel:#ffffff;

    --naturea-bg:#355222;
    --naturea-accent:#d69362;
    --naturea-accent-active:#b67d53;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--surface);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 48px;
    min-height:100vh;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }

  .top{
    padding:32px 28px 26px;
    text-align:center;
  }
  .avatar{
    width:108px;
    height:108px;
    border-radius:50%;
    margin:0 auto 20px;
    border:4px solid var(--sand-100);
    background:var(--naturea-bg);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-initials{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    color:#ffffff;
  }
  .contact-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    color:var(--ink);
    text-align:center;
    margin:0 0 4px;
  }
  .contact-role{
    font-size:13.5px;
    color:var(--ink-muted);
    text-align:center;
    margin:0 0 16px;
  }
  .save-contact{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:12px 0;
    margin:0 0 22px;
    border:none;
    border-radius:12px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  .save-contact:active{ opacity:.85; }
  .save-contact svg{ width:18px; height:18px; }
  .contact{
    text-align:left;
  }
  .contact a{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:9px 6px;
    border-radius:10px;
    color:var(--ink);
    text-decoration:none;
    font-size:14.5px;
    line-height:1.4;
  }
  .contact a:active{ background:var(--sand-50); }
  .contact svg{
    flex:none;
    width:19px;
    height:19px;
    margin-top:1px;
    color:var(--ink-muted);
  }

  .band{
    padding:30px 28px 26px;
    text-align:center;
  }
  .band-logo{
    display:block;
    height:auto;
    margin:0 auto 14px;
  }
  .band-tagline{
    font-size:13.5px;
    line-height:1.5;
    margin:0 auto 22px;
    max-width:270px;
  }
  .band-naturea .band-tagline{ color:rgba(255,255,255,.82); }
  .band-naturea .band-logo{ width:66%; max-width:230px; }

  .band-cta{
    display:block;
    width:100%;
    padding:13px 0;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    text-align:center;
    margin-bottom:20px;
  }
  .band-naturea{ background:var(--naturea-bg); }
  .band-naturea .band-cta{ background:var(--naturea-accent); color:#ffffff; }
  .band-naturea .band-cta:active{ background:var(--naturea-accent-active); }
  .band-naturea .social a{ border-color:rgba(255,255,255,.35); color:#ffffff; }
  .band-naturea .social a:active{ background:rgba(255,255,255,.12); }

  .social{
    display:flex;
    justify-content:center;
    gap:14px;
  }
  .social a{
    width:46px;
    height:46px;
    border-radius:50%;
    border:1.5px solid;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
  }
  .social svg{ width:20px; height:20px; }
</style>
</head>
